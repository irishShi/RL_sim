[General]
abstract = true
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec
seed-set = ${repetition}
**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP
**.vector-recording = true

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

############### General PHY parameters ##############
**.downlinkInterference = true
**.uplinkInterference = true
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
**.targetBler = 0.01
**.blerShift = 5
**.fbPeriod = 40tti   # reports CQI every 40ms

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config MultiCell
#
# General configuration for the for a multicell NR Standalone deployment
#
[Config MultiCell]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
sim-time-limit=20s
description = "Base configuration, do not run this config!"
abstract = true

############# Floorplan parameters ################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 750m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 250m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### CA configuration #################
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = ${u=0}
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = ${numRbs=50}

*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############### BS position #################
*.gnb1.mobility.initialX = 250m
*.gnb1.mobility.initialY = 500m
*.gnb2.mobility.initialX = 750m
*.gnb2.mobility.initialY = 500m

############### X2 configuration #################
*.gnb*.numX2Apps = 1                                        # one x2App per peering node
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)  # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

############## UE configuration ##################
*.numUe = ${numUEs=1,10,30}

# UEs associates to the best BS at the beginning of the simulation
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true

############ UEs position #################
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.initialX = uniform(0m,1000m)
*.ue[*].mobility.initialY = uniform(250m,750m)
*.ue[*].mobility.speed = uniform(3mps,13.89mps)
#------------------------------------#



#------------------------------------#
# Config CBR-DL
#
# Configuration with CBR DL traffic from a remote server to the UEs
#
[Config CBR-DL]
extends = MultiCell
description = "CBR DL traffic from remote server to UEs"

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = ${numUEs}

#============= Application Setup =============
*.ue[*].app[*].typename = "CbrReceiver"
*.ue[*].app[*].localPort = 3000

*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 100B
*.server.app[*].samplingTime = 0.02s
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
*.server.app[*].finishTime = uniform(19.9s,19.92s)

#------------------------------------#



#------------------------------------#
# Config CBR-UL
#
# Configuration with CBR UL traffic from the UEs to a remote server
#
[Config CBR-UL]
extends=MultiCell
description = "CBR UL traffic from UEs to remote server"

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = ${numUEs}

#============= Application Setup =============
*.server.app[*].typename = "CbrReceiver"
*.server.app[*].localPort = 3000 + ancestorIndex(0)

*.ue[*].app[*].typename = "CbrSender"
*.ue[*].app[*].packetSize = 100B
*.ue[*].app[*].samplingTime = 0.02s
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].destPort = 3000 + ancestorIndex(1)
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
*.ue[*].app[*].finishTime = uniform(19.9s,19.92s)
#------------------------------------#
[Config Railway-300-DL]
network = simu5g.simulations.nr.networks.MultiCell_Standalone
description = "Railway 3km two-gNB handover scenario, 300 km/h, single UE"
sim-time-limit = 36s

############### Fixed NR carrier configuration ###############
*.carrierAggregation.numComponentCarriers = 1
*.carrierAggregation.componentCarrier[0].numerologyIndex = 0
*.carrierAggregation.componentCarrier[0].carrierFrequency = 2GHz
*.carrierAggregation.componentCarrier[0].numBands = 50
*.gnb*.cellularNic.numCarriers = 1
*.gnb*.cellularNic.channelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"
*.ue[*].cellularNic.numCarriers = 1
*.ue[*].cellularNic.nrChannelModel[0].componentCarrierModule = "carrierAggregation.componentCarrier[0]"

############### 3 km railway line area ###############
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMaxX = 3100m
**.mobility.constraintAreaMinY = 400m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 30m
**.mobility.initFromDisplayString = false

############### Two terminal gNBs, about 3 km apart ###############
*.gnb1.mobility.initialX = 0m
*.gnb1.mobility.initialY = 500m
*.gnb1.mobility.initialZ = 25m
*.gnb2.mobility.initialX = 3000m
*.gnb2.mobility.initialY = 500m
*.gnb2.mobility.initialZ = 25m

############### X2 configuration ###############
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"

############### Single train UE ###############
*.numUe = 1
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.initialX = 0m
*.ue[0].mobility.initialY = 500m
*.ue[0].mobility.initialZ = 1.5m
*.ue[0].mobility.speed = 83.333mps
*.ue[0].mobility.initialMovementHeading = 0deg

############### Downlink CBR traffic ###############
*.ue[0].numApps = 1
*.ue[0].app[0].typename = "CbrReceiver"
*.ue[0].app[0].localPort = 3000
*.server.numApps = 1
*.server.app[0].typename = "CbrSender"
*.server.app[0].packetSize = 100B
*.server.app[0].samplingTime = 0.02s
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].startTime = 0.1s
*.server.app[0].finishTime = 35.9s
#------------------------------------#
# Railway sensitivity configurations
# These configs keep the same 3 km two-gNB railway layout and vary channel stress.

[Config Railway-300-DL-TrackOffset]
extends = Railway-300-DL
description = "Railway 3km, 300 km/h, gNBs 150 m away from the track"
*.gnb1.mobility.initialY = 350m
*.gnb2.mobility.initialY = 350m
*.ue[0].mobility.initialY = 500m
**.mobility.constraintAreaMinY = 300m
**.mobility.constraintAreaMaxY = 550m

[Config Railway-300-DL-WeakCoverage]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km, weaker coverage via lower power and lower antenna height"
**.eNodeBTxPower = 40dBm
*.gnb1.mobility.initialZ = 15m
*.gnb2.mobility.initialZ = 15m
*.gnb*.cellularNic.channelModel[0].nodebHeight = 15m
*.ue[*].cellularNic.nrChannelModel[0].nodebHeight = 15m
*.gnb*.cellularNic.channelModel[0].antennGainEnB = 12dBi
*.ue[*].cellularNic.nrChannelModel[0].antennGainEnB = 12dBi

[Config Railway-300-DL-HighNoise]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km, higher receiver noise floor for stress testing"
*.gnb*.cellularNic.channelModel[0].thermalNoise = -96dBm
*.ue[*].cellularNic.nrChannelModel[0].thermalNoise = -96dBm
*.gnb*.cellularNic.channelModel[0].ueNoiseFigure = 9dBm
*.ue[*].cellularNic.nrChannelModel[0].ueNoiseFigure = 9dBm

[Config Railway-300-DL-NlosFading]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km, NLOS/fading/shadowing stress scenario"
*.gnb*.cellularNic.channelModel[0].shadowing = true
*.ue[*].cellularNic.nrChannelModel[0].shadowing = true
*.gnb*.cellularNic.channelModel[0].correlationDistance = 80m
*.ue[*].cellularNic.nrChannelModel[0].correlationDistance = 80m
*.gnb*.cellularNic.channelModel[0].dynamicLos = false
*.ue[*].cellularNic.nrChannelModel[0].dynamicLos = false
*.gnb*.cellularNic.channelModel[0].fixedLos = false
*.ue[*].cellularNic.nrChannelModel[0].fixedLos = false
*.gnb*.cellularNic.channelModel[0].fading = true
*.ue[*].cellularNic.nrChannelModel[0].fading = true
*.gnb*.cellularNic.channelModel[0].fadingType = "RAYLEIGH"
*.ue[*].cellularNic.nrChannelModel[0].fadingType = "RAYLEIGH"
*.gnb*.cellularNic.channelModel[0].numFadingPaths = 8
*.ue[*].cellularNic.nrChannelModel[0].numFadingPaths = 8

[Config Railway-300-DL-HighInterference]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km, stronger inter-cell interference and lower carrier resources"
*.carrierAggregation.componentCarrier[0].numBands = 25
**.downlinkInterference = true
**.uplinkInterference = true
*.gnb*.cellularNic.channelModel[0].downlinkInterference = true
*.ue[*].cellularNic.nrChannelModel[0].downlinkInterference = true
*.gnb*.cellularNic.channelModel[0].uplinkInterference = true
*.ue[*].cellularNic.nrChannelModel[0].uplinkInterference = true
*.gnb*.cellularNic.channelModel[0].bgCellInterference = true
*.ue[*].cellularNic.nrChannelModel[0].bgCellInterference = true
*.gnb*.cellularNic.channelModel[0].extCellInterference = true
*.ue[*].cellularNic.nrChannelModel[0].extCellInterference = true

[Config Railway-300-DL-HeavyTraffic]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km, heavier DL CBR traffic"
*.server.app[0].packetSize = 1000B
*.server.app[0].samplingTime = 0.005s

[Config Railway-300-DL-Stress]
extends = Railway-300-DL-NlosFading
description = "Railway 3km, combined weak coverage, high noise, reduced resources, and heavier traffic"
**.eNodeBTxPower = 40dBm
*.carrierAggregation.componentCarrier[0].numBands = 25
*.gnb1.mobility.initialZ = 15m
*.gnb2.mobility.initialZ = 15m
*.gnb*.cellularNic.channelModel[0].nodebHeight = 15m
*.ue[*].cellularNic.nrChannelModel[0].nodebHeight = 15m
*.gnb*.cellularNic.channelModel[0].thermalNoise = -96dBm
*.ue[*].cellularNic.nrChannelModel[0].thermalNoise = -96dBm
*.gnb*.cellularNic.channelModel[0].antennGainEnB = 12dBi
*.ue[*].cellularNic.nrChannelModel[0].antennGainEnB = 12dBi
*.server.app[0].packetSize = 1000B
*.server.app[0].samplingTime = 0.005s

[Config Railway-300-DL-FixedA3]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km fixed A3+TTT baseline, Hys=3 dB, TTT=160 ms"
result-dir = results/RailwayPolicyCompare
**.cellularNic.nrPhy.railwayA3TttHandover = true
**.cellularNic.nrPhy.railwayA3Hysteresis = 3dB
**.cellularNic.nrPhy.railwayA3TimeToTrigger = 0.16s
**.cellularNic.nrPhy.railwayA3MinNeighborRsrp = -130dB
**.cellularNic.nrPhy.railwayPolicyTableEnabled = false

[Config Railway-300-DL-RLTable]
extends = Railway-300-DL-TrackOffset
description = "Railway 3km RL policy_table controlled A3+TTT"
result-dir = results/RailwayPolicyCompare
**.cellularNic.nrPhy.railwayA3TttHandover = true
**.cellularNic.nrPhy.railwayA3Hysteresis = 3dB
**.cellularNic.nrPhy.railwayA3TimeToTrigger = 0.16s
**.cellularNic.nrPhy.railwayA3MinNeighborRsrp = -130dB
**.cellularNic.nrPhy.railwayPolicyTableEnabled = true
**.cellularNic.nrPhy.railwayPolicyTablePath = "/mnt/c/Users/qichengshi/Desktop/RL_sim/results/policy_tables/policy_table.csv"
**.cellularNic.nrPhy.railwayPolicyUpdateInterval = 0.05s
**.cellularNic.nrPhy.railwayPolicyNoise = -96dBm

