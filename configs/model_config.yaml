# Rainbow DQN 模型配置文件

# 动作空间配置
action_space:
  hys_set: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]  # Hys 离散集合（dB）
  ttt_set: [0, 50, 100, 150, 300, 650]  # TTT离散集合（ms，已与环境量化后执行值一致）
  num_actions: 48  # 总动作数 = 8 * 6

# 观测配置
observation:
  window_size: 15  # 时间窗口长度 N（覆盖 1.5 s，假设 100ms 采样）
  obs_dim: 7  # 单步观测特征维度
  # 特征列表：
  # 0: RSRP_serv (归一化)
  # 1: RSRP_neig (归一化)
  # 2: ΔRSRP (归一化)
  # 3: SINR_serv (归一化)
  # 4: v_norm (速度归一化)
  # 5: pos_norm (位置归一化)
  # 6: time_since_last_ho_norm (距离上次切换时间归一化)
  # 当前 Hys/TTT 不进入策略输入，避免模型学习“当前参数 -> 继续当前动作”的捷径。

# 网络结构配置
network:
  encoder:
    type: "GRU"  # 时序编码器类型
    hidden_dim: 128  # GRU 隐层维度
    num_layers: 1  # GRU 层数
    bidirectional: false  # 是否双向
  
  shared:
    hidden_dim: 256  # 共享特征层隐藏维度
  
  rainbow:
    num_atoms: 51  # C51 分布原子数量
    v_min: -30.0  # 价值最小值（R5 切换区聚焦奖励，Q 值约 -25~+5，留余量）
    v_max: 10.0  # 价值最大值（R5 正向奖励较小，上界约 +5）
    noisy_std_init: 0.5  # NoisyLinear 初始标准差
  
  forecast:
    hidden_dim: 128  # 预测头隐藏维度

# 训练配置
training:
  batch_size: 64
  learning_rate: 6.25e-5  # Rainbow 论文推荐的学习率
  gamma: 0.99  # 折扣因子
  n_steps: 3  # N-step return
  lambda_aux: 0.3  # 辅助预测损失权重
  target_update_freq: 100  # 目标网络软更新频率（步数）
  target_update_tau: 0.005  # 软更新系数 θ_t = τ*θ_o + (1-τ)*θ_t
  
  # 经验回放
  replay_buffer_size: 500000  # 需大于数据集样本数以避免丢弃数据
  replay_start_size: 1000  # 开始训练前的最小样本数
  per_alpha: 0.6  # PER 优先级指数
  per_beta: 0.4  # PER 重要性采样指数
  per_beta_increment: 0.00001  # PER beta 增量
  
  # 探索
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 10000  # epsilon 衰减步数
  
  # 梯度裁剪
  grad_clip: 10.0
  
  # 训练频率
  train_freq: 4  # 每 N 步训练一次
  update_freq: 1  # 每次训练更新 N 次

# 数据归一化范围
normalization:
  delta_rsrp_min: -30.0  # ΔRSRP 最小值（dB）
  delta_rsrp_max: 30.0  # ΔRSRP 最大值（dB）
  velocity_max: 100.0  # 速度最大值（m/s）
  time_since_ho_max: 10.0  # 距离上次切换时间最大值（秒）
