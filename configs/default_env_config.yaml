# 铁路切换算法环境配置文件

# 动作空间配置（如果 use_hys_ttt=true）
action_space:
  hys_set: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]  # Hys 离散集合（dB）
  ttt_set: [0, 40, 80, 160, 320, 640]  # TTT 离散集合（ms）
  # 总动作数 = len(hys_set) × len(ttt_set) = 8 × 6 = 48
  # 如果需要调整动作数量，只需修改上面的列表即可

# 是否使用 Hys/TTT 模式（true=48动作，false=2动作兼容模式）
use_hys_ttt: true

# 轨道参数
track_length_m: 3000.0          # 轨道长度（米）
delta_t_s: 0.05                 # 时间步长（秒，50ms）

# 速度参数（参考 5G‑R 高速铁路场景，车速多在 200~350 km/h）
random_speed: false             # 是否随机速度
v_default_kmh: 300.0            # 默认速度（km/h）
v_min_kmh: 120.0                # 最小速度（km/h）
v_max_kmh: 350.0                # 最大速度（km/h）

# 发射功率（参考 5G/5G‑R 宏站 40 W 左右功率，约 46 dBm）
Ptx_A_dbm: 46.0                 # 基站A发射功率（dBm）
Ptx_B_dbm: 46.0                 # 基站B发射功率（dBm）

# 路径损耗参数（结合 3GPP 38.901 与铁路高架场景取值）
pl0_A_db: 32.4                  # 基站A参考路径损耗（dB），近似 2 GHz 自由空间 PL(1m)
pl0_B_db: 32.4                  # 基站B参考路径损耗（dB）
pathloss_exp_A: 2.7             # 基站A路径损耗指数（开阔高架略大于 2）
pathloss_exp_B: 2.7             # 基站B路径损耗指数
shadow_sigma_A: 4.0             # 基站A阴影衰落标准差（dB），比城市宏站略小
shadow_sigma_B: 4.0             # 基站B阴影衰落标准差（dB）
shadow_corr_distance_m: 80.0    # 阴影相关距离（m），高铁场景 50~100 m 量级

# 噪声和干扰（20 MHz 带宽、约 5 dB 噪声系数，对应接收热噪声约 -96 dBm）
noise_dbm: -96.0                # 噪声功率（dBm）

# 同频干扰配置（基于 5G-R 越区切换场景，公式：I(d) = 10^(Pr1(d)/10) + 10^(Pr2(d)/10)）
use_dynamic_interference: true  # 是否启用动态同频干扰（true=基于位置动态计算，false=使用固定值）
# 动态干扰模式下：
#   - 基站A受到的干扰 = 10^(rsrp_B/10)（基站B的信号功率）
#   - 基站B受到的干扰 = 10^(rsrp_A/10)（基站A的信号功率）
# 干扰功率随UE位置动态变化，真实反映同频组网场景

# 额外同频基站干扰（可选）
enable_extra_interference: false  # 是否启用额外同频基站干扰
extra_interference_dbm: -105.0    # 其他同频基站的额外干扰功率（dBm）

# 静态干扰配置（仅当 use_dynamic_interference=false 时使用）
interference_A_dbm: -100.0      # 基站A固定干扰功率（dBm）
interference_B_dbm: -100.0      # 基站B固定干扰功率（dBm）

# L3滤波参数
l3_alpha: 0.7                    # L3 IIR滤波系数

# Outage阈值和RLF配置
sinr_outage_db: -6.0            # SINR outage阈值（dB），建议起点-6dB，可扫-8/-6/-4
T_out_s: 0.2                    # 连续outage持续时间阈值（秒），建议200ms=4步，可扫100/200/300ms
# 注意：切换中断期间也计入outage

# Reward设计（支持R0/R1/R2消融）
reward_type: "R2"               # R0=仅SINR, R1=SINR+HO惩罚, R2=SINR+HO+Outage惩罚
lambda_ho: 2.0                   # 切换惩罚系数（用于R1/R2），标定：多一次切换≈1秒SINR提升1-2dB的代价
lambda_out: 15.0                 # Outage惩罚系数（用于R2），应大于lambda_ho

# 测量滤波增强
enable_delta_sinr_filter: true  # 是否启用SINR差值滤波
delta_sinr_filter_alpha: 0.7    # SINR差值IIR滤波系数（等效时间常数100-200ms，2-4步）

# TTS配置（支持时间和距离两种模式）
TTS_mode: "time"                # "time"=按时间, "distance"=按距离
T_guard_s: 1.0                   # 切换保护时间（秒），用于time模式
T_guard_m: 50.0                  # 切换保护距离（米），用于distance模式（高铁场景更直观）

# TTT量化（确保TTT是50ms的倍数）
ttt_quantize_to_50ms: true       # 是否将TTT量化到50ms网格

# 天气参数范围
T_min: -10.0                     # 最低温度（摄氏度）
T_max: 40.0                      # 最高温度（摄氏度）
H_min: 20.0                      # 最低湿度（%）
H_max: 100.0                     # 最高湿度（%）
PM_min: 0.0                      # 最低PM2.5
PM_max: 300.0                    # 最高PM2.5

# 天气对路径损耗的影响系数
a_T: 0.02                        # 温度影响系数
a_H: 0.01                        # 湿度影响系数
a_PM: 0.002                      # PM2.5影响系数

# 归一化范围
rsrp_min_dbm: -120.0            # RSRP最小值（dBm）
rsrp_max_dbm: -60.0             # RSRP最大值（dBm）
sinr_min_db: -10.0              # SINR最小值（dB）
sinr_max_db: 20.0               # SINR最大值（dB）

# 奖励参数
C_outage: 10.0                   # Outage惩罚系数
C_ho: 0.3                        # 切换惩罚系数
C_interruption: 0.0              # 切换中断惩罚系数（默认0，因为中断期间SINR已经很低）

# 切换保护时间
T_guard_s: 1.0                   # 切换保护时间（秒）

# 切换中断配置
ho_interruption_slots: 1        # 切换导致的通信中断时隙数（默认1个时隙，即50ms）
ho_interruption_sinr_db: -20.0   # 中断期间的SINR值（dB），设置为很低的值以模拟通信中断
ho_interruption_rsrp_dbm: -120.0  # 中断期间的RSRP值（dBm），设置为很低的值以模拟通信中断

# 切换重叠区 KPI（5G-R：重叠区含过渡/测量/执行；此处用「半宽」近似：轨道中点 ± W）
# W = ho_overlap_transition_half_m + ho_overlap_meas_exec_extra_m + v * ho_overlap_meas_exec_delay_s
ho_overlap_kpi_enabled: true
ho_overlap_midpoint_m: null     # null = 轨道中点（两 gNB 位于 0 与 track_length_m 时即越区边界）
ho_overlap_transition_half_m: 25.0   # 单侧 1/2 切换过渡距离（m），全宽约 50 m 量级可调
ho_overlap_meas_exec_delay_s: 0.2    # 测量+执行等效时延（s），单侧距离 += 车速×该时延
ho_overlap_meas_exec_extra_m: 0.0    # 额外固定距离（m），用于细调或与文献对齐

