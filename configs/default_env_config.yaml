# 铁路切换算法环境配置文件

# 动作空间配置（如果 use_hys_ttt=true）
action_space:
  hys_set: [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]  # Hys 离散集合（dB）
  ttt_set: [0, 50, 100, 150, 300, 650]  # TTT离散集合（ms，已与50ms量化网格对齐）
  # 总动作数 = len(hys_set) × len(ttt_set) = 8 × 6 = 48
  # 如果需要调整动作数量，只需修改上面的列表即可

# 是否使用 Hys/TTT 模式（true=48动作，false=2动作兼容模式）
use_hys_ttt: true

# 轨道参数
track_length_m: 3000.0          # 轨道长度（米）
delta_t_s: 0.05                 # 时间步长（秒，50ms）

# 速度参数（覆盖普速铁路到磁悬浮的全速域场景）
random_speed: true              # 是否随机速度
v_default_kmh: 300.0            # 默认速度（km/h）
v_min_kmh: 80.0                 # 最小速度（km/h）
v_max_kmh: 500.0                # 最大速度（km/h）

# 分层速度采样（enabled=true 时按权重从各速度段采样，替代简单均匀分布）
# 权重反映实际铁路运营中各速度段的典型性：高速铁路标准运营最常见，极端速度较少但需覆盖
speed_tiers:
  enabled: true
  tiers:
    - range: [80, 120]          # 普速铁路
      weight: 0.08
    - range: [120, 200]         # 城际/动车组
      weight: 0.22
    - range: [200, 300]         # 高速铁路标准运营
      weight: 0.30
    - range: [300, 350]         # 高速铁路上限（CR400系列）
      weight: 0.20
    - range: [350, 400]         # 下一代高铁（CR450）
      weight: 0.12
    - range: [400, 500]         # 磁悬浮/试验场景
      weight: 0.08

# 发射功率（参考 5G/5G‑R 宏站 40 W 左右功率，约 46 dBm）
Ptx_A_dbm: 46.0                 # 基站A发射功率（dBm）
Ptx_B_dbm: 46.0                 # 基站B发射功率（dBm）

# 路径损耗参数（结合 3GPP 38.901 与铁路高架场景取值）
pl0_A_db: 32.4                  # 基站A参考路径损耗（dB），近似 2 GHz 自由空间 PL(1m)
pl0_B_db: 32.4                  # 基站B参考路径损耗（dB）
pathloss_exp_A: 2.7             # 基站A路径损耗指数（开阔高架略大于 2）
pathloss_exp_B: 2.7             # 基站B路径损耗指数
shadow_sigma_A: 4.0             # 基站A阴影衰落标准差（dB），比城市宏站略小
shadow_sigma_B: 4.0             # 基站B阴影衰落标准差（dB）
shadow_corr_distance_m: 80.0    # 阴影相关距离（m），高铁场景 50~100 m 量级

# 噪声和干扰（20 MHz 带宽、约 5 dB 噪声系数，对应接收热噪声约 -96 dBm）
noise_dbm: -96.0                # 噪声功率（dBm）

# 同频干扰配置（基于 5G-R 越区切换场景，公式：I(d) = 10^(Pr1(d)/10) + 10^(Pr2(d)/10)）
use_dynamic_interference: true  # 是否启用动态同频干扰（true=基于位置动态计算，false=使用固定值）
# 动态干扰模式下：
#   - 基站A受到的干扰 = 10^(rsrp_B/10)（基站B的信号功率）
#   - 基站B受到的干扰 = 10^(rsrp_A/10)（基站A的信号功率）
# 干扰功率随UE位置动态变化，真实反映同频组网场景

# 额外同频基站干扰（可选）
enable_extra_interference: false  # 是否启用额外同频基站干扰
extra_interference_dbm: -105.0    # 其他同频基站的额外干扰功率（dBm）

# 静态干扰配置（仅当 use_dynamic_interference=false 时使用）
interference_A_dbm: -100.0      # 基站A固定干扰功率（dBm）
interference_B_dbm: -100.0      # 基站B固定干扰功率（dBm）

# L3滤波参数
l3_alpha: 0.7                    # L3 IIR滤波系数

# Outage阈值和RLF配置
sinr_outage_db: -6.0            # SINR outage阈值（dB），建议起点-6dB，可扫-8/-6/-4
T_out_s: 0.2                    # 连续outage持续时间阈值（秒），建议200ms=4步，可扫100/200/300ms
# 注意：切换中断期间也计入outage

# Reward设计
# R0=仅SINR, R1=HO惩罚, R2=旧版二值outage, R3=分级outage+中断主惩罚
# R4=事件驱动型（推荐：零基线 + 稀疏但显著的正/负信号，区分度远高于R3）
reward_type: "R5"
lambda_ho: 1.0                   # 旧版HO惩罚系数（R1/R2）
lambda_out: 5.0                  # 最高等级outage惩罚（R2/R3）

# R3: 分级SINR/Outage惩罚（R3/R4共用阈值）
sinr_warn_db: -3.0               # 轻度劣化阈值（dB）
sinr_degrade_db: -5.0            # 中度劣化阈值（dB）
lambda_sinr_warn: 0.5            # R3用：轻度惩罚
lambda_sinr_degrade: 1.5         # R3用：中度惩罚

# R3: 用中断时长替代切换次数作为主惩罚
lambda_interruption: 2.0         # R3用：每个中断时隙惩罚
lambda_ho_minor: 0.15            # R3用：可选轻量HO惩罚

# R4: 事件驱动型奖励参数
# 零基线 + 仅在关键事件时给非零奖励，让好坏动作差距 >> 环境方差
r4_lambda_outage: 15.0           # outage 惩罚（最严重）
r4_lambda_degrade: 5.0           # SINR 中度劣化惩罚
r4_lambda_warn: 2.0              # SINR 轻度劣化惩罚
r4_lambda_interruption: 8.0      # 切换中断每时隙惩罚
r4_lambda_ho: 2.0                # 每次切换惩罚
r4_overlap_sinr_good_db: 5.0     # 重叠区SINR良好阈值（dB）
r4_overlap_sinr_bad_db: -2.0     # 重叠区SINR劣化阈值（dB）
r4_overlap_bonus: 0.5            # 重叠区SINR良好时的正向奖励
r4_overlap_penalty: 2.0          # 重叠区SINR劣化时的额外惩罚
r4_fast_speed_mps: 83.3          # 高速阈值（m/s，≈300 km/h）
r4_sinr_margin_db: 8.0           # 高速+高SINR余量阈值（dB）
r4_sinr_margin_bonus: 0.3        # 高速场景保持SINR余量的正向奖励

# R5: 切换区聚焦型奖励参数
# 设计：切换区外奖励≈0（单基站主导，决策无影响），切换区内集中学习信号
# 好策略 = 少切换 + 切换区内高信号质量；坏策略 = 多切换（多中断）+ 低信号质量
r5_sinr_shaping_alpha: 0.0       # 关闭（SINR不依赖动作，对Q值学习是纯噪声）
r5_sinr_target_db: 2.0           # SINR shaping 零点（如启用）
r5_sinr_range_db: 10.0           # SINR 归一化范围（如启用）
r5_subopt_alpha: 0.4             # 次优服务小区惩罚系数（动作依赖：邻区更强时每步惩罚 0~0.4）
r5_subopt_range_db: 6.0          # 次优惩罚归一化范围（ΔRSRP 达到此值时惩罚满额）
r5_ho_penalty: 1.0               # 切换区内每次切换惩罚（降低以鼓励必要切换）
r5_interruption_penalty: 2.0     # 切换区内每个中断时隙惩罚
r5_outage_penalty: 5.0           # 切换区内 outage 惩罚（提高以惩罚不切换导致的断连）
r5_pingpong_extra_penalty: 2.0   # 乒乓切换额外惩罚
r5_outside_outage_penalty: 1.0   # 切换区外 outage 安全网惩罚
r5_outside_interruption_penalty: 0.5  # 切换区外中断惩罚

# 奖励尺度系数（可被训练阶段策略动态覆盖）
reward_outage_scale: 1.0
reward_interruption_scale: 1.0
reward_ho_scale: 1.0

# 训练阶段权重调度（建议用于 collect_data.py 生成离线数据）
reward_training_phases:
  enabled: true
  phases:
    - end_episode_ratio: 0.4
      reward_outage_scale: 1.3        # 前期先保可用性
      reward_interruption_scale: 0.8
      reward_ho_scale: 1.0
    - end_episode_ratio: 1.0
      reward_outage_scale: 1.0        # 后期强化中断与无效切换抑制
      reward_interruption_scale: 1.4
      reward_ho_scale: 1.8

# 测量滤波增强
enable_delta_sinr_filter: true  # 是否启用SINR差值滤波
delta_sinr_filter_alpha: 0.7    # SINR差值IIR滤波系数（等效时间常数100-200ms，2-4步）

# TTS配置（支持时间和距离两种模式）
TTS_mode: "time"                # "time"=按时间, "distance"=按距离
T_guard_s: 0.0                   # 切换保护时间（秒），0表示关闭time模式保护
T_guard_m: 50.0                  # 切换保护距离（米），用于distance模式（高铁场景更直观）

# TTT量化（确保TTT是50ms的倍数）
ttt_quantize_to_50ms: true       # 是否将TTT量化到50ms网格

# 归一化范围
rsrp_min_dbm: -120.0            # RSRP最小值（dBm）
rsrp_max_dbm: -60.0             # RSRP最大值（dBm）
sinr_min_db: -10.0              # SINR最小值（dB）
sinr_max_db: 20.0               # SINR最大值（dB）

# 奖励参数
C_outage: 10.0                   # Outage惩罚系数
C_ho: 0.3                        # 切换惩罚系数
C_interruption: 0.0              # 切换中断惩罚系数（默认0，因为中断期间SINR已经很低）

# 切换保护时间
T_guard_s: 0.0                   # 切换保护时间（秒），0表示关闭

# 切换中断配置
ho_interruption_slots: 1        # 切换导致的通信中断时隙数（默认1个时隙，即50ms）
ho_interruption_sinr_db: -20.0   # 中断期间的SINR值（dB），设置为很低的值以模拟通信中断
ho_interruption_rsrp_dbm: -120.0  # 中断期间的RSRP值（dBm），设置为很低的值以模拟通信中断

# 动态切换区 KPI
# 定义（单一连续区间，避免快衰落导致多个碎片重叠区）：
# 1) 找到最左侧满足 (RSRP_A - RSRP_B) ≤ +N 的点作为 x_left
# 2) 找到最右侧满足 (RSRP_A - RSRP_B) ≥ -N 的点作为 x_right
# 3) 切换区 = [x_left, x_right]
# 参考铁路 5G-R 网络规划文献：切换区由实际信号覆盖决定，而非固定几何位置。
# 此定义随阴影衰落等实时信道条件自适应变化。
ho_overlap_kpi_enabled: true
ho_overlap_delta_rsrp_db: 5.0        # ΔRSRP 门限 N（dB）：用于切换区左右边界定义（见 envs/train_ho_env.py）
